<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mini Notes App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; }
        .delete-btn { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .notes-list div { background: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .summary-area { background: #e9ecef; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Mini Notes (^_^)</h1>
    <textarea id="noteInput" rows="3" placeholder="Input note..."></textarea>
    <button id="saveBtn">Save Note</button>

    <h2>My Notes</h2>
    <div class="notes-list" id="notesContainer"></div>

    <button id="summarizeBtn">Summarize All Notes</button>
    <div class="summary-area" id="summaryResult">Click the button to summarize notes</div>

    <script src="./app.js" type="module"></script>
</body>
</html>
